<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>C++ WebAssembly Bridge Test</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 500px; margin: 40px auto; padding: 0 20px; }
        .row { display: flex; gap: 8px; margin-bottom: 12px; }
        input { flex: 1; padding: 8px; font-size: 16px; }
        button { padding: 8px 16px; font-size: 16px; cursor: pointer; }
        #log { background: #1e1e1e; color: #d4d4d4; padding: 14px; border-radius: 6px; min-height: 120px; white-space: pre-wrap; font-family: monospace; }
    </style>
</head>
<body>
    <h2>C++ Table Bridge Test</h2>

    <div class="row">
        <input id="tableName" type="text" placeholder="Table name (e.g., users)" value="users">
        <button id="createBtn" disabled>Create Table</button>
    </div>

    <div class="row">
        <input id="colName" type="text" placeholder="Column name (e.g., email)">
        <button id="addColBtn" disabled>Add Column</button>
    </div>

    <div id="log">Loading WebAssembly module...</div>

    <!-- Load the Emscripten glue script -->
    <script src="../module.js"></script>
    <script>
        let wasmModule = null;
        let currentTable = null;
        const logBox = document.getElementById("log");

        function log(msg) {
            logBox.textContent += "\n" + msg;
        }

        // 1. Initialize the WebAssembly module asynchronously on page load
        async function initWasm() {
            try {
                // Module() is the global factory created by -sMODULARIZE=1
                wasmModule = await Module();
                logBox.textContent = "✅ WebAssembly module loaded and ready!";
                document.getElementById("createBtn").disabled = false;
            } catch (err) {
                logBox.textContent = "❌ Failed to load WASM: " + err;
            }
        }

        // 2. Create a C++ Table instance
        document.getElementById("createBtn").addEventListener("click", () => {
            const name = document.getElementById("tableName").value.trim();
            if (!name) return;

            // Free any previous Table instance so we don't leak C++ memory
            if (currentTable) {
                currentTable.delete();
            }

            currentTable = new wasmModule.Table(name);
            document.getElementById("addColBtn").disabled = false;
            log(`Created C++ Table: "${name}"`);
        });

        // 3. Call Table::addCol on the C++ instance
        document.getElementById("addColBtn").addEventListener("click", () => {
            const col = document.getElementById("colName").value.trim();
            if (!col || !currentTable) return;

            currentTable.addCol(col);
            log(`Called addCol("${col}") successfully!`);
            document.getElementById("colName").value = "";
        });

        // Clean up C++ memory if the user closes or refreshes the tab
        window.addEventListener("beforeunload", () => {
            if (currentTable) currentTable.delete();
        });

        initWasm();
    </script>
</body>
</html>
